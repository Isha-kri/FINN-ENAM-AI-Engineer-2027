services:
  - type: web
    name: finn-enam-prototype
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: FINN_DATA_DIR
        value: /tmp/finn-data
